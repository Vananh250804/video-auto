# Quảng cáo shop / giỏ hàng quay một shot, có người nói hoặc chỉ có hình + nhạc
name: shop-ads
description: Video quảng cáo sản phẩm quay thật, phụ đề theo lời nói, chữ highlight giá và ưu đãi
steps:
  - probe
  - cut            # bỏ qua nếu video không có tiếng nói
  - subtitle
  - plan           # edit-planner: yêu cầu của bạn (hoặc mặc định) → edit.json
  - render
  - qa
defaults:
  captionStyle: tiktok
  originalVolume: 1
  overlays_hint: "Làm nổi bật giá, % giảm, quà tặng, freeship, lời kêu gọi mua (bấm giỏ hàng). 2 đến 4 chữ highlight."
  sfx_hint: "Pop hoặc ding khi chữ highlight hiện, ka-ching hoặc sub-hit khi hiện giá, whoosh khi chuyển cảnh nhanh, foley (đặt sản phẩm, chạm) khi thấy rõ hành động trong lời nói."
  zooms_hint: "Zoom giật vào lúc nhắc tên sản phẩm, công dụng chính, ưu đãi; khoảng 1 zoom mỗi 4 đến 6 giây."
